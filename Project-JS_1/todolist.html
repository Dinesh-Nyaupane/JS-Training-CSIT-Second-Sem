<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO LIST</title>
 <style>
    html, body{
        height: 100%;
        margin: 0;
        background-image: linear-gradient(to bottom, rgb(204, 117, 183), rgb(175, 69, 223));
        display: flex;
        justify-content: center;
        align-items: center; 
    }

    .mainFormparent
    {
        border: 2px solid black;
        height: 500px;
        width: 700px;
       display: flex;
       flex-direction: column;
        border-radius: 20px;
       background-color: white;
    }

    #ProjectTitle
    {
        border: 1px solid black;
        border-radius: 20px;
        height: 18%;
        width: 95%;
        margin: 20px 20px 0px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
       font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
       font-size: 30px;
       font-weight: 800;
    }

        #inputBox
    {
        border: 1px solid black;
        border-radius: 20px;
        height: 15%;
        width: 95%;
        margin: 20px 20px 0px 20px;
        display: flex;
        gap: 10px;
        flex-direction: row;
       padding: 5px 5px 5px 5px;
    }

#Taskbox
{
    height: 60px;
    width: 78%;
    border-radius: 20px;
    padding: 0px 0px 0px 50px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 20px;
    font-weight: 500;
}

#submit
{
       height: 60px;
       width: 20%;
    border-radius: 20px;
    color: white;
    background-color: red;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-weight: 500;
    font-size: 20px;
    cursor: pointer;
}

#tasklist
{
    margin-right: 50px;
    margin-left: 20px;
}
    #output
    {
        border: 1px solid black;
        border-radius: 20px;
        height: 55%;
        width: 95%;
        margin: 20px 20px 20px 20px;
        overflow-x: hidden;
        overflow-y: scroll;
    }
    /*----------------------------  */
    /* css for list created in js */

#jsTasklist
{
    display: flex;
    flex-direction: row;
    gap: 50px;
  align-items: center;
    justify-content: space-between;
    margin: 10px 10px 10px 10px;
    overflow: hidden;
    background-color: rgb(186, 225, 177);
    border-radius: 20px;
}

/* css for checkbox created using js */
#tickbox
{
    height: 20px;
    width: 20px;
    margin-right: 30px;
}
/* css for delete button created using js */
#deleteButton
{
    height: 30px;
    width: 30px;
    border: 2px solid black;
    border-radius: 20px;
    background-color: red;
    padding: 5px;
    color: black;
    margin-right: 30px;
}

    /*----------------------------  */
</style>
</head>
<body>

<form action="">

<div class="mainFormparent">

    <div id="ProjectTitle" class="formCompo">TO-DO-LIST📝</div>
    <div id="inputBox" class="formCompo">
        
        <input type="text" id="Taskbox" placeholder="Add your task here">
        <button id="submit" type="submit">Add</button>

    </div>
        <div class="formCompo" id="output">
            <ul id="tasklist"></ul>
        </div>

</div>

</form>

    <script src="./todolist.js"></script>
</body>
</html>

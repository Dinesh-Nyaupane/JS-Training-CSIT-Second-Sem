<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature COnverter</title>
  <style>
    html, body{
        height: 100%;
        margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

.mainParent
{
    height: 600px;
    width: 1020px;
    border: 2px solid black;
    border-radius: 18px;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    background-color: rgb(19, 119, 119);
   

}

.parentsChild
{
    /* border: 1px solid black; */
    border-radius: 18px 0px 0px 18px;
    height: 95%;
    width: 48%;
}

#boxright
{
    border-radius: 0px 18px 18px 0px;
    background-color: rgb(19, 119, 119);
    padding: 10px;
    margin-right: 5px;
}

#boxleft
{
    display: flex;
    flex-direction: column;
    gap: 30px;
    padding: 10px;
    background-color: rgb(235, 156, 58);
  margin-left: 5px;
}

#divtitle
{
    border: 1px solid black;
    border-radius: 18px 0px 0px 18px;
    height: 20%;
    width: 98%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 40px;
    font-weight: 500;
}

#inputBOX
{
    border: 1px solid black;
    border-radius: 18px 0px 0px 18px;
    height: 70%;
    width: 98%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#botton
{
    border: 1px solid black;
    border-radius: 18px 0px 0px 18px;
    height: 20%;
    width: 98%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#submitbtn
{
    height: 60px;
    width: 160px;
    border-radius: 25px;
    padding: 7px;
     font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    background-color: greenyellow;
}

#submitbtn:hover
{
    background-color: rgb(91, 141, 16);
     transition: 0.3s ease-in;
}

#switchbtn
{
    height: 40px;
    width: 80px;
    border-radius: 15px;
    padding: 5px;
     font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    font-weight: 900;
    margin-top: 5px;
    cursor: pointer;
    background-color: greenyellow;
}

#switchbtn:hover{
    background-color: green;
    transition: 0.3s ease-in;
}

#units
{
    /* border: 2px solid black; */
    height: 50px;
    width: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    left: 300px;
    top: 200px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 70px;
    font-weight: 600;
}

#output
{
      /* border: 2px solid black; */
    height: 100px;
    width: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    left: 200px;
    top: 200px;
     font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size:60px;
    font-weight: 600;
}

span{
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 30px;
    font-weight: 400;
}

.tempBOX
{
    height: 50px;
    width: 400px;
    border-radius: 12px;
    padding: 5px 5px 5px 20px;
    
}
/* ----------------------------------- */
/* to remove the arrow buttons of input box */
  .tempBOX::-webkit-inner-spin-button,
  .tempBOX::-webkit-outer-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
/* ----------------------------------- */

  </style>
</head>
<body>
    <div class="mainParent">

 <div class="parentsChild" id="boxleft">
    
        <div class="leftboxChild" id="divtitle">Enter Temperature</div>   
                <div class="leftboxChild" id="inputBOX">
                        
                        <span id="degreeSpan">Degree</span><br>
                        <input class="tempBOX" id="tempBOX1" type="number" placeholder="Enter Temperature">
                        <br>
                         <span id="FahrenheitSpan">Fahrenheit</span><br>
                        <input class="tempBOX" id="tempBOX2" type="number" placeholder="Fahrenheit (℉)" required readonly>
                         <button type="submit" id="switchbtn">Switch🔄</button>
                 </div>

         <div class="leftboxChild" id="botton">
                <button type="submit" id="submitbtn">Convert  →</button>
         </div>
 </div>

   <div class="parentsChild" id="boxright">

        <div id="units">℉</div>
        <div id="output"></div>

   </div>

    </div>
    <script src="./tempConverter.js"></script>
</body>
</html>

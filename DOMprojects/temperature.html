<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./temperature.css">
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="temp">
                <select name="" id="temp" placeholder="Temperature">
                    <option value="">Temperature</option>
                </select>
            </div>
            <div class="converter">
                <div class="celsius">
                    <input type="text" id="celsius">
                    <select name="" id="cel" placeholder="Degree Celsius">
                        <option value="">Degree Celsius</option>
                    </select>
                </div>
                <div class="equal">=</div>
                <div class="farenheit">
                    <input type="text" id="farenheit">
                    <select name="" id="far" placeholder="Degree Farenheit">
                        <option value="">Farenheit</option>
                    </select>
                </div>
            </div>
            <div class="formula">
                <div class="for">formula</div>
                <div class="mula">°C=(°F-32)*5/9</div>
            </div>
        </div>
    </div>
    <script src="./temperature.js"></script>
</body>
</html>

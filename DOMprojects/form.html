<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./form.css">
</head>
<body>
    <div class="container">
        <form action="submit" id="foorm" novalidate>
            <div id="NAAA">
            <label for="">NAME:</label><br>
            <input type="text" id="name" placeholder="enter name here" >
            <p id="nameko"></p>
            </div>
            <br>
            <div id="EMMM">
            <label for="">EMAIL:</label><br>
            <input type="email" id="mail" placeholder="enter email here" >
            <p id="emailko"></p>
            </div>
            <br>
            <div id="ADD">
            <label for="">ADDRESS:</label><br>
            <input type="text" id="address" placeholder="enter address here" >
            <p id="addko"></p>
            </div>
            <br>
            <div id="PW">
            <label for="">PASSWORD:</label><br>
            <input type="password" id="pass" placeholder="enter password" >
            </div>
            <br>
            <div id="CPW">
            <label for="">CONFIRM PASSWORD</label><br>
            <input type="password" id="conpass" placeholder="confirm password" >
            <p id="passko"></p>
            </div>
            <br>
            <button type="submit" id="sub">SUBMIT</button>
        </form>
    </div>
    <script src="./form.js"></script>
</body>
</html>

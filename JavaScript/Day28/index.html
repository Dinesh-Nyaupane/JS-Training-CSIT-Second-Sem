<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="calculator-container">
      <div class="calculator-header">
        <h1><i class="fas fa-calculator"></i>Calculator</h1>
        <p>Perform basic arithmetic operations with ease</p>
      </div>
      <div>
        <div class="input-group">
          <label for="number">
            <i class="fas fa-hashtag"></i> Enter first number:</label
          >
          <input
            type="number"
            id="number"
            name="number"
            required
            placeholder="Enter a number"
          />
        </div>

        <div class="input-group">
          <label for="number2">
            <i class="fas fa-hashtag"></i> Enter second number:</label
          >
          <input
            type="number"
            id="number2"
            name="number2"
            required
            placeholder="Enter a number"
          />
        </div>

        <label><i class="fas fa-cogs"></i> Choose operation:</label>
        <div class="operations">
          <button type="button" id="add" class="operation-btn" onclick="add()">
            <i class="fas fa-plus"></i> Add
          </button>
          <button
            type="button"
            id="subtract"
            class="operation-btn"
            onclick="subtract()"
          >
            <i class="fas fa-minus"></i> Subtract
          </button>
          <button
            type="button"
            id="multiply"
            class="operation-btn"
            onclick="multiply()"
          >
            <i class="fas fa-times"></i> Multiply
          </button>
          <button
            type="button"
            id="divide"
            class="operation-btn"
            onclick="divide()"
          >
            <i class="fas fa-divide"></i> Divide
          </button>
        </div>

        <div class="result-container">
          <div id="result">Your result will appear here</div>
        </div>
      </div>

      <div class="footer">
        <p>Calculator App &copy; 2025 | All operations validated</p>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
